services:
  db:
    image: postgres:16-alphine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iam_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

app:
  build: .
  restart: unless-stopped
  ports:
    - "3000:3000"
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/iam_platform
    JWT_SECRET: super-segret-key
    RUST_LOG: info
  depends_on:
    db:
      condition: service_healthy

volumes:
  postgres_data: